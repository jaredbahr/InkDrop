# The scheduler runs inside this one service by default, so this is the
# whole install -- no separate worker container needed.
#
# The paths below are InkDrop's own defaults, so nothing extra needs to be
# set: /state holds the database, logs, cache, and backups; /staging is
# where downloads land before they are checked and imported.
#
# This is the beta channel, pinned to one signed, verified digest --
# not the bare ghcr.io/jaredbahr/inkdrop name, which is reserved for a
# future stable release.
services:
  inkdrop:
    image: ghcr.io/jaredbahr/inkdrop-beta@sha256:ca29ff1d454343f14b9b800886942bea4a1a71b10089a1e43aae1d8d43a082b1
    container_name: inkdrop
    environment:
      # Off by default so a fresh install never grabs anything before you've
      # reviewed your setup. Turned on here because this is the documented
      # path new users follow, and a beta build that silently finds nothing
      # is worse than one that starts searching right away.
      INKDROP_QUEUE_RUNNER_AUTOPILOT_ENABLED: "1"
    ports:
      - "8796:8796"
    volumes:
      - ./config:/config
      - ./state:/state
      - ./staging:/staging
      - ./manual-inbox:/manual-inbox
      - /path/to/your/Comics:/library/comics
      - /path/to/your/Manga:/library/manga
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-B", "inkdrop_container_healthcheck.py", "--timeout", "5"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
