# The scheduler runs inside this one service by default, so this is the
# whole install -- no separate worker container needed.
#
# Four mounts, matching the paths the image actually uses:
#   /config          database, logs, cache, backups, quarantine, manual inbox
#   /downloads       where downloads land before they are checked and imported
#   /data/comics     your comic library
#   /data/manga      your manga library
#
# Mounting a library somewhere else without also changing Comic root or
# Manga root under Settings -> Media Management leaves it invisible to
# InkDrop, so it is worth keeping these as they are.
services:
  inkdrop:
    image: ghcr.io/jaredbahr/inkdrop:latest
    container_name: inkdrop
    environment:
      # Off by default so a fresh install never grabs anything before you've
      # reviewed your setup. Turned on here because this is the documented
      # path new users follow, and a beta build that silently finds nothing
      # is worse than one that starts searching right away.
      INKDROP_QUEUE_RUNNER_AUTOPILOT_ENABLED: "1"
    ports:
      - "8796:8796"
    volumes:
      - ./config:/config
      - ./downloads:/downloads
      - /path/to/your/Comics:/data/comics
      - /path/to/your/Manga:/data/manga
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-B", "core/inkdrop_container_healthcheck.py", "--timeout", "5"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
