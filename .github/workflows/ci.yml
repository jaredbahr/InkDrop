name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prelint:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Validate Python syntax
        run: python3 -m py_compile inkdrop_web.py

      - name: Validate docker-compose.yml
        run: docker compose config --quiet

      - name: Check Prettier formatting (CSS source files)
        run: npx prettier@3 --check 'web/static/css/src/*.css'

      - name: Check Prettier formatting (JS source files)
        run: npx prettier@3 --check 'web/static/js/*.js'

      - name: Validate JS syntax
        run: find web/static/js -type f -name '*.js' -print0 | xargs -0 -n1 node --check

  build-amd64:
    name: Build amd64
    needs: [prelint]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        run: |
          echo "short_sha=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          echo "build_date=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"
          VERSION=$(grep -oP 'DEFAULT_VERSION\s*=\s*"\K[^"]+' inkdrop_version.py || echo "dev")
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build and push amd64 image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          provenance: false
          outputs: type=image,name=ghcr.io/${{ github.repository_owner }}/inkdrop,push-by-digest=true
          build-args: |
            INKDROP_VERSION=${{ steps.meta.outputs.version }}
            INKDROP_COMMIT_SHA=${{ github.sha }}
            INKDROP_BUILD_DATE=${{ steps.meta.outputs.build_date }}
            INKDROP_RELEASE_CHANNEL=stable
          cache-from: type=gha,scope=amd64
          cache-to: type=gha,scope=amd64,mode=max

  build-arm64:
    name: Build arm64
    needs: [prelint]
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        run: |
          echo "short_sha=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          echo "build_date=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"
          VERSION=$(grep -oP 'DEFAULT_VERSION\s*=\s*"\K[^"]+' inkdrop_version.py || echo "dev")
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build and push arm64 image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          provenance: false
          outputs: type=image,name=ghcr.io/${{ github.repository_owner }}/inkdrop,push-by-digest=true
          build-args: |
            INKDROP_VERSION=${{ steps.meta.outputs.version }}
            INKDROP_COMMIT_SHA=${{ github.sha }}
            INKDROP_BUILD_DATE=${{ steps.meta.outputs.build_date }}
            INKDROP_RELEASE_CHANNEL=stable
          cache-from: type=gha,scope=arm64
          cache-to: type=gha,scope=arm64,mode=max

  manifest:
    name: Push multi-arch manifest
    needs: [build-amd64, build-arm64]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Extract version
        id: meta
        run: |
          echo "short_sha=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          VERSION=$(grep -oP 'DEFAULT_VERSION\s*=\s*"\K[^"]+' inkdrop_version.py || echo "dev")
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create and push multi-arch manifest
        run: |
          IMAGE="ghcr.io/${{ github.repository_owner }}/inkdrop"
          docker buildx imagetools create \
            -t "${IMAGE}:latest" \
            -t "${IMAGE}:${{ steps.meta.outputs.version }}" \
            -t "${IMAGE}:sha-${{ steps.meta.outputs.short_sha }}" \
            "${IMAGE}@${{ needs.build-amd64.outputs.digest }}" \
            "${IMAGE}@${{ needs.build-arm64.outputs.digest }}"

      - name: Verify manifest
        run: |
          IMAGE="ghcr.io/${{ github.repository_owner }}/inkdrop"
          docker buildx imagetools inspect "${IMAGE}:latest"